name: goldwen_app
description: A premium dating app that prioritizes quality over quantity connections.
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.1.0 <4.0.0'
  flutter: ">=3.13.0"

dependencies:
  audioplayers: ^6.1.0
  cached_network_image: ^3.3.0
  crypto: ^3.0.3
  cupertino_icons: ^1.0.6
  dio: ^5.3.3
  emoji_picker_flutter: ^4.3.0
  file_picker: ^8.1.6
  firebase_auth: ^6.0.1
  firebase_core: ^4.1.0
  firebase_messaging: ^16.0.0
  flutter:
    sdk: flutter
  flutter_gen: ^5.9.0
  flutter_image_compress: ^2.1.0
  flutter_local_notifications: ^19.4.1
  flutter_localizations:
    sdk: flutter
  flutter_svg: ^2.0.9
  geolocator: ^14.0.2
  go_router: ^16.2.0
  google_fonts: ^6.1.0
  google_sign_in: 6.1.5
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  http: ^1.1.0
  http_parser: ^4.1.2
  image_cropper: ^10.0.0+1
  image_picker: ^1.0.4
  in_app_purchase: ^3.1.11
  intl: ^0.20.2
  lottie: ^3.3.1
  mixpanel_flutter: ^2.3.1
  path_provider: ^2.1.1
  permission_handler: ^12.0.1
  provider: ^6.1.1
  purchases_flutter: ^9.6.2
  share_plus: ^10.1.4
  shared_preferences: ^2.2.2
  shimmer: ^3.0.0
  sign_in_with_apple: ^7.0.1
  socket_io_client: ^2.0.3+1
  timezone: ^0.10.1
  uuid: ^4.2.1
  video_player: ^2.9.2

dev_dependencies:
  build_runner: ^2.4.7
  flutter_launcher_icons: ^0.14.3
  flutter_lints: ^6.0.0
  flutter_native_splash: ^2.4.4
  flutter_test:
    sdk: flutter
  hive_generator: ^2.0.1
  mockito: ^5.4.4

flutter:
  uses-material-design: true
  generate: true
  
  assets:
    - assets/images/
    - assets/icons/
    - assets/animations/
    
  fonts:
    - family: Playfair Display
      fonts:
        - asset: assets/fonts/PlayfairDisplay-Regular.ttf
        - asset: assets/fonts/PlayfairDisplay-Bold.ttf
          weight: 700
    - family: Lato
      fonts:
        - asset: assets/fonts/Lato-Regular.ttf
        - asset: assets/fonts/Lato-Bold.ttf
          weight: 700
        - asset: assets/fonts/Lato-Light.ttf
          weight: 300

# Phase 5 — icônes d'app et splash screen, générés depuis les assets de marque existants
# (assets/images/logo_base.png, logo_sans_fond.png). Commandes à lancer après
# `flutter pub get` (nécessite le SDK Flutter, indisponible dans cet environnement) :
#   flutter pub run flutter_launcher_icons
#   dart run flutter_native_splash:create
flutter_launcher_icons:
  android: true
  ios: true
  remove_alpha_ios: true
  image_path: "assets/images/logo_base.png"
  adaptive_icon_background: "#FAF0E6"
  adaptive_icon_foreground: "assets/images/logo_sans_fond.png"
  min_sdk_android: 21

flutter_native_splash:
  color: "#FAF0E6"
  image: assets/images/logo_sans_fond.png
  color_dark: "#171511"
  image_dark: assets/images/logo_light.png
  android_12:
    color: "#FAF0E6"
    image: assets/images/logo_sans_fond.png
    color_dark: "#171511"
    image_dark: assets/images/logo_light.png
  web: false
